# .github/workflows/snake.yml
name: GitHub-Snake

on:
  schedule: # 20:15 CST == 12:15 UTC
    - cron: "15 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate GitHub Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake/github-snake.svg
            assets/snake/github-snake-dark.svg?palette=github-dark
            assets/snake/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9&color_background=#aaaaaa

      - name: Commit & Push changes
        uses: EndBug/add-and-commit@v10
        with:
          default_author: github_actions
          message: ":robot: chore(snake): 自动更新 GitHub 贡献图贪吃蛇"
